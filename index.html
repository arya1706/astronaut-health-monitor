<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRONAUT HEALTH MONITOR · Commander Alex Carter (ARES-01)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🚀</text></svg>" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#05070e',
              900: '#090d16',
              850: '#0d1322',
              800: '#11192e',
              750: '#16203a',
              700: '#1d2a4a',
            }
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['Inter', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts & Prop-Types -->
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #05070e;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      background-attachment: fixed;
      color: #e2e8f0;
    }

    .glass-panel {
      background: rgba(13, 19, 34, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .glass-panel-hover:hover {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 10px 35px 0 rgba(6, 182, 212, 0.15);
      transform: translateY(-2px);
    }

    .glow-normal {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.25), inset 0 0 10px rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .glow-warning {
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
    }

    .glow-critical {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.75);
      animation: pulseCritical 1.2s infinite alternate;
    }

    @keyframes pulseCritical {
      0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
      100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.8); }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(9, 13, 22, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-black">
  
  <div id="root"></div>

  <!-- Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      ResponsiveContainer,
      AreaChart,
      Area,
      LineChart,
      Line,
      XAxis,
      YAxis,
      CartesianGrid,
      Tooltip,
      ReferenceLine,
    } = window.Recharts;

    // Helper functions
    const evaluateSpO2 = (val) => {
      if (val >= 95) return 'NORMAL';
      if (val >= 90) return 'WARNING';
      return 'CRITICAL';
    };

    const evaluateHeartRate = (val) => {
      if (val >= 60 && val <= 100) return 'NORMAL';
      if ((val >= 50 && val < 60) || (val > 100 && val <= 120)) return 'WARNING';
      return 'CRITICAL';
    };

    const evaluateTemperature = (val) => {
      if (val >= 36.1 && val <= 37.5) return 'NORMAL';
      if ((val >= 35.5 && val < 36.1) || (val > 37.5 && val <= 38.0)) return 'WARNING';
      return 'CRITICAL';
    };

    const evaluateSleep = (val) => {
      if (val >= 5.0 && val <= 9.0) return 'NORMAL';
      if ((val >= 4.0 && val < 5.0) || (val > 9.0 && val <= 10.0)) return 'WARNING';
      return 'CRITICAL';
    };

    const evaluateExercise = (val) => {
      if (val >= 20 && val <= 120) return 'NORMAL';
      if ((val >= 10 && val < 20) || (val > 120 && val <= 150)) return 'WARNING';
      return 'CRITICAL';
    };

    const computeOverall = (statuses) => {
      if (statuses.includes('CRITICAL')) return 'CRITICAL';
      if (statuses.includes('WARNING')) return 'WARNING';
      return 'NORMAL';
    };

    const formatHHMMSS = (date = new Date()) => date.toTimeString().split(' ')[0];

    const formatElapsed = (sec) => {
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${d} days, ${h} hours, ${m} minutes, ${s} seconds`;
    };

    // Main App Component
    function App() {
      const [metrics, setMetrics] = useState({
        heartRate: {
          id: 'heartRate',
          name: 'Heart Rate',
          value: 76,
          unit: 'BPM',
          range: '60 – 100 BPM',
          status: 'NORMAL',
          trend: 'stable',
          icon: 'activity',
          history: [74, 75, 77, 76, 78, 75, 76, 77, 76],
        },
        spo2: {
          id: 'spo2',
          name: 'Blood Oxygen (SpO₂)',
          value: 98,
          unit: '%',
          range: '95 – 100 % (Critical <90%)',
          status: 'NORMAL',
          trend: 'stable',
          icon: 'droplets',
          history: [98, 98, 97, 98, 98, 97, 98, 98, 98],
        },
        temperature: {
          id: 'temperature',
          name: 'Body Temperature',
          value: 36.7,
          unit: '°C',
          range: '36.1 – 37.5 °C',
          status: 'NORMAL',
          trend: 'stable',
          icon: 'thermometer',
          history: [36.6, 36.7, 36.6, 36.8, 36.7, 36.7, 36.6],
        },
        sleepDuration: {
          id: 'sleepDuration',
          name: 'Sleep Duration',
          value: 7.4,
          unit: 'hrs',
          range: '5.0 – 9.0 hrs',
          status: 'NORMAL',
          trend: 'stable',
          icon: 'moon',
          history: [7.2, 7.3, 7.4],
        },
        exerciseTime: {
          id: 'exerciseTime',
          name: 'Exercise Time',
          value: 45,
          unit: 'min',
          range: '20 – 120 min / day',
          status: 'NORMAL',
          trend: 'stable',
          icon: 'dumbbell',
          history: [30, 40, 45],
        },
      });

      const [telemetryHistory, setTelemetryHistory] = useState(() => {
        const pts = [];
        const now = Date.now();
        for (let i = 20; i >= 0; i--) {
          const t = new Date(now - i * 3000);
          pts.push({
            timeFormatted: formatHHMMSS(t),
            heartRate: Math.round(74 + Math.sin(i / 2) * 4 + (Math.random() * 2 - 1)),
            spo2: Math.min(100, Math.max(95, Math.round(98 + Math.cos(i / 3)))),
            temperature: Number((36.6 + Math.sin(i / 4) * 0.2).toFixed(1)),
          });
        }
        return pts;
      });

      const [alerts, setAlerts] = useState([
        {
          id: 'a-1',
          timestamp: '14:18:33',
          severity: 'INFO',
          title: 'Routine health telemetry received',
          message: 'Bio-monitoring link established via ARES Orbital Relay.',
          value: 'NOMINAL',
          acknowledged: true,
        },
        {
          id: 'a-2',
          timestamp: '14:21:08',
          severity: 'WARNING',
          title: 'Heart rate above normal range',
          message: 'Heart rate reached 104 BPM during countermeasure phase.',
          value: '104 BPM',
          acknowledged: true,
        },
        {
          id: 'a-3',
          timestamp: '14:27:42',
          severity: 'CRITICAL',
          title: 'Blood oxygen dropped below 90%',
          message: 'CRITICAL: Blood oxygen level below safe threshold.',
          value: '89%',
          acknowledged: true,
        },
      ]);

      const [activeBanner, setActiveBanner] = useState(null);
      const [isSimActive, setIsSimActive] = useState(true);
      const [simSpeed, setSimSpeed] = useState(1);
      const [secSinceUpdate, setSecSinceUpdate] = useState(0);

      const [missionTimeSec, setMissionTimeSec] = useState(14 * 3600 + 32 * 60 + 18);
      const [elapsedSec, setElapsedSec] = useState(127 * 86400 + 14 * 3600 + 32 * 60);
      const [chartTab, setChartTab] = useState('spo2');
      const [alertFilter, setAlertFilter] = useState('ALL');

      const prevStatusRef = useRef({
        heartRate: 'NORMAL',
        spo2: 'NORMAL',
        temperature: 'NORMAL',
      });

      const overallStatus = computeOverall([
        metrics.heartRate.status,
        metrics.spo2.status,
        metrics.temperature.status,
        metrics.sleepDuration.status,
        metrics.exerciseTime.status,
      ]);

      // Timer ticks
      useEffect(() => {
        const timer = setInterval(() => {
          setSecSinceUpdate((prev) => prev + 1);
          setMissionTimeSec((prev) => (prev + 1) % 86400);
          setElapsedSec((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Refresh Lucide icons
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Simulation loop
      useEffect(() => {
        if (!isSimActive) return;

        const intervalMs = 3000 / simSpeed;
        const timer = setInterval(() => {
          const tStr = formatHHMMSS();

          setMetrics((prev) => {
            // Heart rate smooth variation
            let hrDelta = (Math.random() * 4 - 2);
            let newHr = Math.round(Math.min(135, Math.max(45, prev.heartRate.value + hrDelta)));
            const hrStat = evaluateHeartRate(newHr);
            const hrTrend = newHr > prev.heartRate.value ? 'up' : newHr < prev.heartRate.value ? 'down' : 'stable';

            // SpO2 smooth variation
            let spo2Delta = Math.random() < 0.1 ? -1 : Math.random() > 0.85 ? 1 : 0;
            if (Math.random() < 0.02 && prev.spo2.value >= 94) spo2Delta = -6; // rare drift
            let newSpo2 = Math.min(100, Math.max(86, prev.spo2.value + spo2Delta));
            const spo2Stat = evaluateSpO2(newSpo2);
            const spo2Trend = newSpo2 > prev.spo2.value ? 'up' : newSpo2 < prev.spo2.value ? 'down' : 'stable';

            // Temperature smooth variation
            let tempDelta = (Math.random() * 0.2 - 0.1);
            let newTemp = Number(Math.min(39.0, Math.max(34.8, prev.temperature.value + tempDelta)).toFixed(1));
            const tempStat = evaluateTemperature(newTemp);
            const tempTrend = newTemp > prev.temperature.value ? 'up' : newTemp < prev.temperature.value ? 'down' : 'stable';

            // Alert checks
            const newAlerts = [];
            if (newSpo2 < 90 && prevStatusRef.current.spo2 !== 'CRITICAL') {
              const a = {
                id: `a-${Date.now()}-spo2`,
                timestamp: tStr,
                severity: 'CRITICAL',
                title: 'CRITICAL: Blood oxygen level below safe threshold',
                message: `Arterial oxygen saturation dropped to dangerous levels (${newSpo2}%).`,
                value: `${newSpo2}%`,
                acknowledged: false,
              };
              newAlerts.push(a);
              setActiveBanner(a);
            } else if (spo2Stat === 'WARNING' && prevStatusRef.current.spo2 === 'NORMAL') {
              newAlerts.push({
                id: `a-${Date.now()}-spo2-w`,
                timestamp: tStr,
                severity: 'WARNING',
                title: 'Blood oxygen in warning range',
                message: `Blood oxygen saturation is low (${newSpo2}%).`,
                value: `${newSpo2}%`,
                acknowledged: false,
              });
            }

            if (hrStat === 'CRITICAL' && prevStatusRef.current.heartRate !== 'CRITICAL') {
              const a = {
                id: `a-${Date.now()}-hr-c`,
                timestamp: tStr,
                severity: 'CRITICAL',
                title: newHr > 120 ? 'CRITICAL: Heart rate above emergency threshold' : 'CRITICAL: Severe bradycardia',
                message: `Heart rate crossed critical limit (${newHr} BPM).`,
                value: `${newHr} BPM`,
                acknowledged: false,
              };
              newAlerts.push(a);
              if (newSpo2 >= 90) setActiveBanner(a);
            }

            prevStatusRef.current = { heartRate: hrStat, spo2: spo2Stat, temperature: tempStat };

            if (newAlerts.length) {
              setAlerts((pa) => [...newAlerts, ...pa].slice(0, 20));
            }

            // Append chart telemetry
            setTelemetryHistory((ph) => [
              ...ph.slice(-25),
              { timeFormatted: tStr, heartRate: newHr, spo2: newSpo2, temperature: newTemp }
            ]);

            setSecSinceUpdate(0);

            return {
              heartRate: { ...prev.heartRate, value: newHr, status: hrStat, trend: hrTrend, history: [...prev.heartRate.history.slice(-19), newHr] },
              spo2: { ...prev.spo2, value: newSpo2, status: spo2Stat, trend: spo2Trend, history: [...prev.spo2.history.slice(-19), newSpo2] },
              temperature: { ...prev.temperature, value: newTemp, status: tempStat, trend: tempTrend, history: [...prev.temperature.history.slice(-19), newTemp] },
              sleepDuration: prev.sleepDuration,
              exerciseTime: prev.exerciseTime,
            };
          });

        }, intervalMs);

        return () => clearInterval(timer);
      }, [isSimActive, simSpeed]);

      // Anomaly triggers
      const triggerAnomaly = (type) => {
        const tStr = formatHHMMSS();
        if (type === 'CRITICAL_O2') {
          const val = 88;
          const a = {
            id: `manual-o2-${Date.now()}`,
            timestamp: tStr,
            severity: 'CRITICAL',
            title: 'CRITICAL: Blood oxygen level below safe threshold',
            message: `Emergency oxygen drop triggered. Current value: ${val}%.`,
            value: `${val}%`,
            acknowledged: false,
          };
          setMetrics((p) => ({
            ...p,
            spo2: { ...p.spo2, value: val, status: 'CRITICAL', trend: 'down', history: [...p.spo2.history.slice(-19), val] }
          }));
          prevStatusRef.current.spo2 = 'CRITICAL';
          setAlerts((pa) => [a, ...pa].slice(0, 20));
          setActiveBanner(a);
        } else if (type === 'TACHYCARDIA') {
          const val = 128;
          const a = {
            id: `manual-hr-${Date.now()}`,
            timestamp: tStr,
            severity: 'CRITICAL',
            title: 'CRITICAL: Heart rate above emergency threshold',
            message: `Tachycardia spike induced (${val} BPM).`,
            value: `${val} BPM`,
            acknowledged: false,
          };
          setMetrics((p) => ({
            ...p,
            heartRate: { ...p.heartRate, value: val, status: 'CRITICAL', trend: 'up', history: [...p.heartRate.history.slice(-19), val] }
          }));
          prevStatusRef.current.heartRate = 'CRITICAL';
          setAlerts((pa) => [a, ...pa].slice(0, 20));
          setActiveBanner(a);
        } else if (type === 'HYPOTHERMIA') {
          const val = 35.1;
          const a = {
            id: `manual-temp-${Date.now()}`,
            timestamp: tStr,
            severity: 'CRITICAL',
            title: 'CRITICAL: Thermal hypothermia detected',
            message: `Core temperature dropped to ${val}°C.`,
            value: `${val}°C`,
            acknowledged: false,
          };
          setMetrics((p) => ({
            ...p,
            temperature: { ...p.temperature, value: val, status: 'CRITICAL', trend: 'down', history: [...p.temperature.history.slice(-19), val] }
          }));
          prevStatusRef.current.temperature = 'CRITICAL';
          setAlerts((pa) => [a, ...pa].slice(0, 20));
          setActiveBanner(a);
        } else if (type === 'RESET') {
          setMetrics((p) => ({
            ...p,
            heartRate: { ...p.heartRate, value: 76, status: 'NORMAL', trend: 'stable' },
            spo2: { ...p.spo2, value: 98, status: 'NORMAL', trend: 'stable' },
            temperature: { ...p.temperature, value: 36.7, status: 'NORMAL', trend: 'stable' },
          }));
          prevStatusRef.current = { heartRate: 'NORMAL', spo2: 'NORMAL', temperature: 'NORMAL' };
          setActiveBanner(null);
          setAlerts((pa) => [
            { id: `res-${Date.now()}`, timestamp: tStr, severity: 'INFO', title: 'Parameters Normalized', message: 'All vital signs returned to safe range.', value: 'NORMAL', acknowledged: true },
            ...pa
          ].slice(0, 20));
        }
        setSecSinceUpdate(0);
      };

      const formatMissionTime = (totalSec) => {
        const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSec % 60).padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
      };

      const metricList = Object.values(metrics);
      const filteredAlerts = alerts.filter((a) => alertFilter === 'ALL' || a.severity === alertFilter);

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* 1. Header */}
          <header className="w-full glass-panel border-b border-cyan-500/20 bg-space-900/90 sticky top-0 z-40 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3.5">
                <div className="flex items-center justify-center w-11 h-11 rounded-xl bg-cyan-950/80 border border-cyan-500/40 shadow-lg shadow-cyan-500/10">
                  <i data-lucide="cpu" className="w-6 h-6 text-cyan-400"></i>
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="px-2 py-0.5 text-[10px] font-mono font-bold tracking-widest uppercase bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 rounded">
                      NASA / ARES HUD
                    </span>
                    <span className="text-xs font-mono text-slate-400 flex items-center space-x-1">
                      <i data-lucide="wifi" className="w-3 h-3 text-emerald-400"></i>
                      <span>TELEMETRY LINK: <strong className="text-emerald-400">CONNECTED</strong></span>
                    </span>
                  </div>
                  <h1 className="text-xl font-display font-extrabold text-white tracking-wider uppercase mt-0.5">
                    ASTRONAUT HEALTH MONITOR
                  </h1>
                  <div className="text-xs font-medium text-slate-300 flex items-center gap-2 mt-0.5">
                    <span className="font-semibold text-cyan-300">Commander Alex Carter</span>
                    <span className="text-slate-600">·</span>
                    <span className="px-1.5 py-0.5 bg-slate-800 text-cyan-400 rounded text-[11px] font-mono border border-slate-700">
                      ARES-01
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 sm:gap-6">
                <div className="flex items-center space-x-2 bg-space-850 px-3 py-1.5 rounded-lg border border-cyan-500/20">
                  <span className={`h-2.5 w-2.5 rounded-full ${isSimActive ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  <span className="text-xs font-mono font-bold text-slate-200 uppercase">
                    {isSimActive ? '● LIVE MONITORING' : 'PAUSED'}
                  </span>
                </div>

                <div className="flex items-center space-x-2.5 bg-space-850 px-3.5 py-1.5 rounded-lg border border-cyan-500/20">
                  <i data-lucide="clock" className="w-4 h-4 text-cyan-400"></i>
                  <div>
                    <div className="text-[10px] font-mono text-slate-400 uppercase tracking-widest">MISSION DAY 127</div>
                    <div className="text-sm font-mono font-bold text-cyan-300 tracking-wider">
                      {formatMissionTime(missionTimeSec)}
                    </div>
                  </div>
                </div>

                <div className="text-right font-mono text-[11px] hidden md:block">
                  <div className="text-slate-400">Earth Date: <span className="text-slate-200">{new Date().toISOString().split('T')[0]}</span></div>
                  <div className="text-slate-400">Last Update: <span className="text-cyan-400 font-semibold">{secSinceUpdate === 0 ? 'Just now' : `${secSinceUpdate}s ago`}</span></div>
                </div>
              </div>

            </div>
          </header>

          {/* 2. Main Dashboard */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Critical Alert Banner */}
            {activeBanner && (
              <div className={`w-full rounded-xl border p-4 transition-all duration-300 backdrop-blur-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 ${
                activeBanner.severity === 'CRITICAL'
                  ? 'bg-red-950/90 border-red-500/80 text-red-100 shadow-2xl shadow-red-500/30'
                  : 'bg-amber-950/90 border-amber-500/80 text-amber-100'
              }`}>
                <div className="flex items-start space-x-3.5">
                  <div className="p-2.5 rounded-lg bg-red-900/60 border border-red-400/50">
                    <i data-lucide="alert-octagon" className="w-6 h-6 text-red-300"></i>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="px-2 py-0.5 text-[10px] font-mono font-bold rounded bg-red-500 text-black">
                        {activeBanner.severity} ALERT
                      </span>
                      <span className="text-xs font-mono opacity-80">TIMESTAMP: {activeBanner.timestamp}</span>
                    </div>
                    <h3 className="text-lg font-display font-bold text-white mt-1">{activeBanner.title}</h3>
                    <p className="text-xs text-slate-200 mt-0.5">{activeBanner.message}</p>
                  </div>
                </div>

                <div className="flex items-center gap-3 self-end sm:self-center">
                  <div className="text-right px-3 py-1.5 rounded-lg bg-black/40 border border-white/10">
                    <div className="text-[10px] font-mono opacity-70">VALUE</div>
                    <div className="text-lg font-mono font-bold">{activeBanner.value}</div>
                  </div>
                  <button
                    onClick={() => setActiveBanner(null)}
                    className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-mono text-xs font-bold border border-white/20"
                  >
                    ACKNOWLEDGE
                  </button>
                </div>
              </div>
            )}

            {/* Overall Health Status Panel */}
            <div className={`rounded-2xl p-5 border transition-all duration-500 ${
              overallStatus === 'CRITICAL' ? 'bg-red-950/70 border-red-500/60 glow-critical' :
              overallStatus === 'WARNING' ? 'bg-amber-950/60 border-amber-500/50 glow-warning' :
              'bg-emerald-950/40 border-emerald-500/40 glow-normal'
            }`}>
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-5">
                <div className="flex items-center space-x-4">
                  <div className={`p-3.5 rounded-2xl border ${
                    overallStatus === 'CRITICAL' ? 'bg-red-900/40 border-red-500' :
                    overallStatus === 'WARNING' ? 'bg-amber-900/40 border-amber-500' :
                    'bg-emerald-900/40 border-emerald-500'
                  }`}>
                    <i data-lucide={overallStatus === 'CRITICAL' ? 'alert-octagon' : overallStatus === 'WARNING' ? 'alert-triangle' : 'shield-check'} className="w-9 h-9 text-white"></i>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className={`px-2.5 py-0.5 text-xs font-mono font-bold rounded uppercase ${
                        overallStatus === 'CRITICAL' ? 'bg-red-500/30 text-red-300 border border-red-500/50' :
                        overallStatus === 'WARNING' ? 'bg-amber-500/30 text-amber-300 border border-amber-500/50' :
                        'bg-emerald-500/30 text-emerald-300 border border-emerald-500/50'
                      }`}>
                        ● STATUS: {overallStatus}
                      </span>
                    </div>
                    <h2 className="text-xl sm:text-2xl font-display font-extrabold text-white mt-1">
                      {overallStatus === 'CRITICAL' ? 'CRITICAL HEALTH ALERT: IMMEDATE INTERVENTION REQUIRED' :
                       overallStatus === 'WARNING' ? 'WARNING: VITAL SIGNS DEGRADED' :
                       'ASTRONAUT VITAL STATUS: OPTIMAL'}
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-300 mt-0.5">
                      {overallStatus === 'CRITICAL' ? 'Blood oxygen or heart rate parameters have breached safety thresholds.' :
                       overallStatus === 'WARNING' ? 'One or more biometric parameters operating in caution threshold.' :
                       'All physiological parameters operating within nominal space mission ranges.'}
                    </p>
                  </div>
                </div>

                {/* Counters */}
                <div className="flex items-center gap-3">
                  <div className="flex flex-col items-center px-3.5 py-2 rounded-xl bg-space-900/80 border border-emerald-500/30 min-w-[70px]">
                    <span className="text-[10px] font-mono text-slate-400">NORMAL</span>
                    <span className="text-lg font-mono font-bold text-emerald-400">{metricList.filter(m => m.status === 'NORMAL').length}</span>
                  </div>
                  <div className="flex flex-col items-center px-3.5 py-2 rounded-xl bg-space-900/80 border border-amber-500/30 min-w-[70px]">
                    <span className="text-[10px] font-mono text-slate-400">WARNING</span>
                    <span className="text-lg font-mono font-bold text-amber-400">{metricList.filter(m => m.status === 'WARNING').length}</span>
                  </div>
                  <div className="flex flex-col items-center px-3.5 py-2 rounded-xl bg-space-900/80 border border-red-500/30 min-w-[70px]">
                    <span className="text-[10px] font-mono text-slate-400">CRITICAL</span>
                    <span className="text-lg font-mono font-bold text-red-400">{metricList.filter(m => m.status === 'CRITICAL').length}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Simulation Controls & Test Anomaly Injectors */}
            <div className="glass-panel rounded-2xl p-4 border border-cyan-500/20 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex flex-wrap items-center gap-3">
                <span className="text-xs font-mono font-bold text-slate-200">SIMULATION ENGINE:</span>
                <button
                  onClick={() => setIsSimActive(!isSimActive)}
                  className={`px-3 py-1.5 rounded-xl font-mono text-xs font-bold border transition-all ${
                    isSimActive ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                  }`}
                >
                  {isSimActive ? 'PAUSE STREAM' : 'RESUME STREAM'}
                </button>

                <div className="flex items-center space-x-1 bg-space-950 p-1 rounded-xl border border-slate-800">
                  <span className="text-[10px] font-mono text-slate-400 px-1">SPEED:</span>
                  {[1, 2, 5].map((spd) => (
                    <button
                      key={spd}
                      onClick={() => setSimSpeed(spd)}
                      className={`px-2 py-0.5 rounded text-xs font-mono font-bold ${
                        simSpeed === spd ? 'bg-cyan-500 text-black' : 'text-slate-400'
                      }`}
                    >
                      {spd}x
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <span className="text-[10px] font-mono text-slate-400 uppercase">TEST ANOMALIES:</span>
                <button onClick={() => triggerAnomaly('CRITICAL_O2')} className="px-2.5 py-1 rounded bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-500/40 font-mono text-xs font-bold">
                  Drop O₂ (&lt;90%)
                </button>
                <button onClick={() => triggerAnomaly('TACHYCARDIA')} className="px-2.5 py-1 rounded bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-500/40 font-mono text-xs font-bold">
                  Tachycardia
                </button>
                <button onClick={() => triggerAnomaly('HYPOTHERMIA')} className="px-2.5 py-1 rounded bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 border border-indigo-500/40 font-mono text-xs font-bold">
                  Hypothermia
                </button>
                <button onClick={() => triggerAnomaly('RESET')} className="px-2.5 py-1 rounded bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 font-mono text-xs font-bold">
                  Normalize
                </button>
              </div>
            </div>

            {/* 5 Parameter Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
              {metricList.map((m) => {
                const isCrit = m.status === 'CRITICAL';
                const isWarn = m.status === 'WARNING';
                return (
                  <div key={m.id} className={`glass-panel glass-panel-hover rounded-2xl p-4 border transition-all flex flex-col justify-between ${
                    isCrit ? 'border-red-500/60 bg-red-950/20' : isWarn ? 'border-amber-500/50 bg-amber-950/20' : 'border-slate-800'
                  }`}>
                    <div>
                      <div className="flex items-start justify-between">
                        <div className="flex items-center space-x-2">
                          <div className={`p-2 rounded-xl border ${isCrit ? 'bg-red-500/20 border-red-500 text-red-400' : isWarn ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-cyan-500/20 border-cyan-500/30 text-cyan-400'}`}>
                            <i data-lucide={m.icon} className="w-4 h-4"></i>
                          </div>
                          <h3 className="text-xs font-display font-bold text-slate-100 uppercase">{m.name}</h3>
                        </div>
                        <span className={`px-2 py-0.5 text-[10px] font-mono font-bold rounded-full ${
                          isCrit ? 'bg-red-500/20 text-red-300 border border-red-500/40' :
                          isWarn ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' :
                          'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                        }`}>{m.status}</span>
                      </div>

                      <div className="mt-3 flex items-baseline justify-between">
                        <div className="flex items-baseline space-x-1.5">
                          <span className="text-3xl font-mono font-extrabold text-white">{m.value}</span>
                          <span className="text-xs font-mono text-slate-400">{m.unit}</span>
                        </div>
                        <span className="text-[10px] font-mono text-cyan-400 uppercase">{m.trend}</span>
                      </div>

                      <div className="text-[10px] font-mono text-slate-400 mt-1">{m.range}</div>
                    </div>

                    <div className="mt-4 pt-2 border-t border-slate-800/80">
                      <div className="w-full bg-space-950 rounded-full h-1.5 overflow-hidden">
                        <div className={`h-full rounded-full ${isCrit ? 'bg-red-500' : isWarn ? 'bg-amber-500' : 'bg-cyan-400'}`} style={{ width: `${m.id === 'spo2' ? m.value : Math.min(100, (m.value/120)*100)}%` }}></div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Charts & Diagnostics Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              {/* Telemetry Chart & Log (2 cols) */}
              <div className="lg:col-span-2 space-y-6">
                
                {/* Recharts Line Graph */}
                <div className="glass-panel rounded-2xl p-5 border border-cyan-500/20">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
                    <div>
                      <h2 className="text-base font-display font-bold text-white uppercase">HEALTH TELEMETRY</h2>
                      <p className="text-[11px] font-mono text-slate-400">Real-time rolling buffer graph</p>
                    </div>

                    <div className="flex items-center space-x-1 bg-space-950 p-1 rounded-xl border border-slate-800">
                      {['spo2', 'heartRate', 'temperature'].map((t) => (
                        <button
                          key={t}
                          onClick={() => setChartTab(t)}
                          className={`px-2.5 py-1 rounded text-xs font-mono font-semibold ${
                            chartTab === t ? 'bg-cyan-500 text-black' : 'text-slate-400'
                          }`}
                        >
                          {t.toUpperCase()}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="h-64 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={telemetryHistory} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                        <defs>
                          <linearGradient id="cGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor={chartTab === 'spo2' ? '#06b6d4' : chartTab === 'heartRate' ? '#38bdf8' : '#10b981'} stopOpacity={0.4} />
                            <stop offset="95%" stopColor="#06b6d4" stopOpacity={0} />
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" />
                        <XAxis dataKey="timeFormatted" stroke="#64748b" tick={{ fontSize: 10 }} />
                        <YAxis stroke="#64748b" tick={{ fontSize: 10 }} domain={chartTab === 'spo2' ? [80, 100] : chartTab === 'heartRate' ? [40, 140] : [34.5, 39]} />
                        <Tooltip contentStyle={{ background: '#0d1322', borderColor: '#06b6d4', fontSize: '11px', color: '#fff' }} />
                        {chartTab === 'spo2' && (
                          <ReferenceLine y={90} stroke="#ef4444" strokeDasharray="5 5" label={{ value: 'CRITICAL O₂ (<90%)', fill: '#ef4444', fontSize: 10 }} />
                        )}
                        {chartTab === 'heartRate' && (
                          <ReferenceLine y={120} stroke="#ef4444" strokeDasharray="5 5" label={{ value: 'Max HR (120 BPM)', fill: '#ef4444', fontSize: 10 }} />
                        )}
                        <Area type="monotone" dataKey={chartTab} stroke={chartTab === 'spo2' ? '#06b6d4' : chartTab === 'heartRate' ? '#38bdf8' : '#10b981'} strokeWidth={2} fill="url(#cGrad)" />
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                {/* Alert History */}
                <div className="glass-panel rounded-2xl p-5 border border-cyan-500/20">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h2 className="text-base font-display font-bold text-white uppercase">ALERT HISTORY</h2>
                    <div className="flex space-x-1">
                      {['ALL', 'CRITICAL', 'WARNING', 'INFO'].map((f) => (
                        <button
                          key={f}
                          onClick={() => setAlertFilter(f)}
                          className={`px-2 py-0.5 text-[10px] font-mono rounded ${
                            alertFilter === f ? 'bg-cyan-500 text-black font-bold' : 'text-slate-400 bg-space-950'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="mt-3 space-y-2 max-h-64 overflow-y-auto">
                    {filteredAlerts.map((a) => (
                      <div key={a.id} className="p-2.5 rounded-xl bg-space-950 border border-slate-800 flex items-start justify-between">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className={`px-1.5 py-0.2 text-[9px] font-mono font-bold rounded ${
                              a.severity === 'CRITICAL' ? 'bg-red-500/20 text-red-300' :
                              a.severity === 'WARNING' ? 'bg-amber-500/20 text-amber-300' : 'bg-cyan-500/20 text-cyan-300'
                            }`}>{a.severity}</span>
                            <span className="text-[10px] font-mono text-slate-400">{a.timestamp}</span>
                          </div>
                          <div className="text-xs font-mono font-bold text-white mt-0.5">{a.title}</div>
                          <div className="text-[11px] text-slate-300">{a.message}</div>
                        </div>
                        {a.value && <span className="text-xs font-mono font-bold text-cyan-300">{a.value}</span>}
                      </div>
                    ))}
                  </div>
                </div>

              </div>

              {/* Sidebar Info & Systems (1 col) */}
              <div className="space-y-6">
                
                {/* Mission Brief */}
                <div className="glass-panel rounded-2xl p-5 border border-cyan-500/20 space-y-3 font-mono text-xs">
                  <h2 className="text-base font-display font-bold text-white uppercase pb-2 border-b border-slate-800">MISSION BRIEF</h2>
                  <div className="flex justify-between p-2 rounded bg-space-950">
                    <span className="text-slate-400">MISSION</span>
                    <span className="font-bold text-cyan-300">ARES-01</span>
                  </div>
                  <div className="flex justify-between p-2 rounded bg-space-950">
                    <span className="text-slate-400">ASTRONAUT</span>
                    <span className="font-bold text-white">Commander Alex Carter</span>
                  </div>
                  <div className="flex justify-between p-2 rounded bg-space-950">
                    <span className="text-slate-400">MISSION DAY</span>
                    <span className="font-bold text-cyan-300">DAY 127</span>
                  </div>
                  <div className="flex justify-between p-2 rounded bg-space-950">
                    <span className="text-slate-400">LOCATION</span>
                    <span className="text-slate-200">Low Earth Orbit</span>
                  </div>
                  <div className="p-2 rounded bg-space-950">
                    <div className="text-[10px] text-slate-400">ELAPSED TIME</div>
                    <div className="text-xs font-bold text-cyan-300 mt-0.5">{formatElapsed(elapsedSec)}</div>
                  </div>
                </div>

                {/* Subsystems */}
                <div className="glass-panel rounded-2xl p-5 border border-cyan-500/20 font-mono text-xs">
                  <h2 className="text-base font-display font-bold text-white uppercase pb-2 border-b border-slate-800">SYSTEM DIAGNOSTICS</h2>
                  <div className="mt-3 space-y-2">
                    {[
                      { name: 'Life Support System', stat: 'ONLINE', sub: 'O₂ Recirc 99.8%' },
                      { name: 'Telemetry Link', stat: 'ONLINE', sub: 'Latency 12ms' },
                      { name: 'Medical Bio-Diagnostics', stat: 'ONLINE', sub: 'AI Engine Active' },
                      { name: 'Suit Dermal Sensors', stat: 'ONLINE', sub: 'Array 100%' },
                      { name: 'Radiation Shielding', stat: 'ONLINE', sub: '0.04 mSv/hr' },
                    ].map((s, idx) => (
                      <div key={idx} className="flex justify-between items-center p-2 rounded bg-space-950">
                        <div>
                          <div className="font-bold text-slate-200">{s.name}</div>
                          <div className="text-[10px] text-slate-400">{s.sub}</div>
                        </div>
                        <span className="px-2 py-0.5 text-[10px] bg-emerald-500/20 text-emerald-400 rounded">{s.stat}</span>
                      </div>
                    ))}
                  </div>
                </div>

              </div>

            </div>

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-space-900/80 py-4 mt-8">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs font-mono text-slate-500">
              NASA / ARES-01 ORBITAL TELEMETRY SUITE · COMMANDER ALEX CARTER
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
